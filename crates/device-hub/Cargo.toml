[package]
name = "device-hub"
version = "0.2.6"
edition.workspace = true
license.workspace = true
description = "Device HUB — ブラウザ無しでマウス/キーボードを設定する GPUI フロントエンド (Liquid Glass)"

[dependencies]
devhub-core = { path = "../devhub-core" }
devhub-hid = { path = "../devhub-hid" }
devhub-update = { path = "../devhub-update" }
devhub-obs = { path = "../devhub-obs" }
fontdue = "0.9"
gpui-kit = "0.9.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
mimalloc = { version = "0.1", default-features = false }
smallvec = "1"
futures = "0.3"
raw-window-handle = "0.6"
notify-rust = "4.18"
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"] }
    windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_Input",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Threading",
    "Win32_Media_Audio",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
] }

[lints.clippy]
# GPUI のビューコードに本質的な複雑さ (参照実装と同じ運用)。
type_complexity = "allow"
too_many_arguments = "allow"
